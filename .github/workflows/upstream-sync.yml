name: Sync upstream-tracking branch

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/kubeflow/kale.git || true
          git fetch upstream main

      - name: Update upstream-tracking branch
        run: |
          git checkout -B upstream-tracking upstream/main
          git push --force origin upstream-tracking
